name: CI

# Cổng chất lượng mỗi thay đổi vào develop:
#   format (Prettier) → test (packages) → engine ↔ _shared in sync → content in sync →
#   KaTeX assets in sync → build web (Expo export).
# Engine là moat (Constitution I). Build web type-check + bundle app universal.

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

# Hủy run cũ trên cùng ref để tiết kiệm phút.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format · test · engine-sync · web build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node (from .nvmrc)
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      # Không commit lockfile (gitignored): npm install resolve tươi cho nền CI để optional deps
      # theo OS (vd @rollup/rollup-linux-*) cài đúng — né bug optional-deps của npm (mirror twolody).
      - name: Install
        run: npm install --no-audit --no-fund

      - name: Prettier (check)
        run: npm run format:check

      - name: Tests (packages — grading-engine)
        run: npm test

      # _shared là bản engine TỰ SINH (D13). Chạy lại sync và đảm bảo không lệch với nguồn ở packages/.
      - name: Engine ↔ _shared in sync
        run: |
          npm run sync:edge
          git diff --exit-code -- supabase/functions/_shared

      # GATE nội dung (D14): validate JSON + manifest auto-discovery không lệch.
      - name: Content valid + manifest in sync
        run: |
          npm run validate:content
          npm run gen:content
          git diff --exit-code -- apps/app/src/lib/content.generated.ts

      # public/katex là vendor copy TỰ SINH từ node_modules/katex (D53). Chạy lại sync và đảm bảo
      # không lệch — tránh quên cập nhật khi nâng cấp katex trong package.json.
      - name: KaTeX assets in sync
        run: |
          npm run sync:katex
          git diff --exit-code -- apps/app/public/katex

      # Edge Functions chạy trên Deno → test logic job nền (idempotency scheduler, SC-006).
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Tests (edge functions — Deno)
        run: deno test review-scheduler/index.test.ts grade-assignment/index.test.ts ai-tutor-explain/index.test.ts delete-account/index.test.ts
        working-directory: supabase/functions

      - name: Build web (Expo export)
        run: npm run build:web --workspace @synaptek/app

      # E2E web — chỉ luồng KHÁCH (không cần Supabase). Luồng đăng nhập ở job e2e-auth.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/app/package.json') }}

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium
        working-directory: apps/app

      - name: E2E (Playwright, guest flows)
        run: npx playwright test tests/e2e/practice.spec.ts tests/e2e/review-lower-grade.spec.ts tests/e2e/diagnostic-path.spec.ts tests/e2e/streak-xp.spec.ts tests/e2e/step-practice.spec.ts tests/e2e/subject-browse.spec.ts tests/e2e/level-picker.spec.ts
        working-directory: apps/app

  # GATE bảo mật: RLS cô lập (chéo vai trò GV/HS/PH) — chạy THẬT trên DB Supabase + migrations.
  rls:
    name: RLS isolation tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.108.0

      - name: Start Supabase (áp migrations)
        run: supabase start -x studio,imgproxy,meta,vector,analytics,realtime

      - name: Run RLS tests (rls-*.sql)
        run: |
          set -e
          for f in supabase/tests/rls-*.sql; do
            echo "== $f =="
            docker exec -i supabase_db_synaptek psql -U postgres -d postgres -v ON_ERROR_STOP=1 < "$f"
          done

  # E2E luồng CÓ ĐĂNG NHẬP (GV/HS/PH): chạy thật trên Supabase (DB + auth + Edge functions) trong CI.
  e2e-auth:
    name: E2E auth-gated (Supabase)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node (from .nvmrc)
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.108.0

      # Bỏ service KHÔNG dùng trong e2e (studio/imgproxy/meta/vector/analytics/realtime) → start nhanh
      # hơn nhiều. Giữ: db, auth, rest, edge-runtime/functions, storage (upload ảnh), inbucket (email
      # quên mật khẩu), kong. Đã verify local: trọn 41 auth spec pass với bộ service giảm này.
      - name: Start Supabase (DB + auth + Edge functions)
        run: supabase start -x studio,imgproxy,meta,vector,analytics,realtime

      - name: Export Supabase env cho app (EXPO_PUBLIC nhúng lúc build)
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321" >> "$GITHUB_ENV"
          KEY=$(supabase status -o json | python3 -c 'import sys,json;print(json.load(sys.stdin)["ANON_KEY"])')
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Warm-up Edge (tránh cold-start timeout call chấm đầu tiên)
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:54321/functions/v1/grade-assignment || true)
            echo "edge: $code"; [ "$code" = "400" ] || [ "$code" = "401" ] || [ "$code" = "405" ] && break
            sleep 2
          done

      # Build export TĨNH để E2E serve `dist/` (không dùng dev server — nhanh + không OOM). Chạy SAU khi
      # export EXPO_PUBLIC_SUPABASE_* để build nhúng đúng URL/key Supabase cục bộ (auth flow cần).
      - name: Build web (Expo export)
        run: npm run build:web --workspace @synaptek/app

      # Cache trình duyệt Playwright (key theo version trong package.json — không lockfile) → né tải
      # ~100MB mỗi lần. --with-deps vẫn chạy (apt idempotent, nhanh khi deps sẵn).
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/app/package.json') }}

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium
        working-directory: apps/app

      - name: E2E auth-gated
        run: |
          npx playwright test --workers=1 \
            tests/e2e/class-join.spec.ts \
            tests/e2e/assignment-grade.spec.ts \
            tests/e2e/assignment-limits.spec.ts \
            tests/e2e/override-analytics.spec.ts \
            tests/e2e/parent-monitor.spec.ts \
            tests/e2e/home-assignment.spec.ts \
            tests/e2e/custom-question.spec.ts \
            tests/e2e/student-class-view.spec.ts \
            tests/e2e/teacher-report.spec.ts \
            tests/e2e/review-mistakes.spec.ts \
            tests/e2e/polish-sprint.spec.ts \
            tests/e2e/auth-progress.spec.ts \
            tests/e2e/logout.spec.ts \
            tests/e2e/authoring-advanced.spec.ts \
            tests/e2e/question-image.spec.ts \
            tests/e2e/assignment-targets.spec.ts \
            tests/e2e/assignment-pool.spec.ts \
            tests/e2e/daily-goal.spec.ts \
            tests/e2e/quick-practice.spec.ts \
            tests/e2e/class-leaderboard.spec.ts \
            tests/e2e/avatar.spec.ts \
            tests/e2e/parent-suggest.spec.ts \
            tests/e2e/multi-select.spec.ts \
            tests/e2e/custom-options.spec.ts \
            tests/e2e/ordering.spec.ts \
            tests/e2e/question-hint.spec.ts \
            tests/e2e/matching.spec.ts \
            tests/e2e/derivation.spec.ts \
            tests/e2e/math-keypad.spec.ts \
            tests/e2e/authoring-math.spec.ts \
            tests/e2e/compound.spec.ts \
            tests/e2e/compound-derivation.spec.ts \
            tests/e2e/sqrt.spec.ts \
            tests/e2e/ai-tutor.spec.ts \
            tests/e2e/forgot-password.spec.ts \
            tests/e2e/change-password.spec.ts \
            tests/e2e/display-name.spec.ts \
            tests/e2e/sign-out-other-devices.spec.ts \
            tests/e2e/avatar-photo.spec.ts \
            tests/e2e/delete-account.spec.ts \
            tests/e2e/latex-render.spec.ts \
            tests/e2e/markdown-import.spec.ts
        working-directory: apps/app
