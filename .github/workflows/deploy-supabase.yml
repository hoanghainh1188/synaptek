name: Deploy Supabase

# Tự động áp migration + deploy Edge Functions lên Supabase hosted khi push develop (chỉ khi đụng backend).
# Bí mật ở GitHub Secrets: SUPABASE_ACCESS_TOKEN (PAT), SUPABASE_DB_PASSWORD, SUPABASE_PROJECT_REF,
# RESEND_API_KEY (SMTP quên mật khẩu — D47, tùy chọn: bỏ trống thì email dùng dịch vụ mặc định giới
# hạn thấp của Supabase, không đủ tin cậy cho email khôi phục mật khẩu thật).
on:
  push:
    branches: [develop]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "supabase/config.toml"
      - "content/questions/**" # answer-keys tự sinh từ content khi sync:edge
      - "packages/grading-engine/**"
      - "packages/learning-path/**"
      - "packages/classroom/**"
      - "scripts/sync-edge-engine.mjs"
  workflow_dispatch: {} # cho phép chạy tay (để test lần đầu)

jobs:
  deploy:
    name: db push + functions deploy
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node (from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.108.0

      - name: Install deps
        run: npm install --no-audit --no-fund

      # _shared (grading-engine + learning-path + classroom + answer-keys) là artifact tự sinh — phải sync
      # trước khi deploy functions để bản trên hosted khớp nguồn ở packages/ + content/ (D13).
      - name: Sync edge _shared
        run: npm run sync:edge

      - name: Link project
        run: supabase link --project-ref "$REF"

      # Baseline: 0001–0004 đã áp lúc deploy đầu bằng SQL trực tiếp (Management API), CHƯA ghi vào hệ
      # migration → đánh dấu "applied" để `db push` không chạy lại (tránh lỗi "đã tồn tại"). Idempotent.
      - name: Baseline migration history (0001–0004)
        run: supabase migration repair --status applied 0001 0002 0003 0004

      - name: DB push (áp migration mới, nếu có)
        run: supabase db push

      - name: Deploy Edge Functions
        run: supabase functions deploy grade grade-assignment review-scheduler ai-tutor-explain delete-account --project-ref "$REF"

      # Đồng bộ auth config hosted theo chủ ý repo (idempotent). jwt_exp = 604800 (1 tuần) khớp config.toml;
      # mailer_autoconfirm = true để luồng đăng-ký-đăng-nhập-ngay chạy. site_url + uri_allow_list (D47,
      # quên mật khẩu) khớp config.toml (wildcard **) để link trong email redirect đúng về app. SMTP
      # Resend CHỈ bật khi đã có secret RESEND_API_KEY — chưa có thì Supabase dùng mailer mặc định
      # (giới hạn thấp, tạm đủ để không phá luồng hiện có, KHÔNG đủ tin cậy cho email khôi phục thật).
      - name: Ensure auth config (jwt expiry + auto-confirm + redirect URLs + SMTP)
        run: |
          PAYLOAD=$(jq -n \
            --arg site_url "https://demo-synaptek.vercel.app" \
            --arg uri_allow_list "http://localhost:8081/**,https://demo-synaptek.vercel.app/**,synaptek://**" \
            '{jwt_exp: 604800, mailer_autoconfirm: true, site_url: $site_url, uri_allow_list: $uri_allow_list}')
          if [ -n "$RESEND_API_KEY" ]; then
            PAYLOAD=$(echo "$PAYLOAD" | jq \
              --arg pass "$RESEND_API_KEY" \
              '. + {
                smtp_host: "smtp.resend.com",
                smtp_port: 587,
                smtp_user: "resend",
                smtp_pass: $pass,
                smtp_sender_name: "Synaptek",
                smtp_admin_email: "onboarding@resend.dev",
                mailer_subjects_recovery: "Khôi phục mật khẩu Synaptek",
                mailer_templates_recovery_content: "<h2>Khôi phục mật khẩu</h2><p>Bấm vào link bên dưới để đặt mật khẩu mới cho tài khoản Synaptek của bạn.</p><p><a href=\"{{ .ConfirmationURL }}\">Đặt lại mật khẩu</a></p><p>Nếu bạn không yêu cầu, hãy bỏ qua email này.</p>"
              }')
            echo "SMTP: Resend bật (smtp_admin_email=onboarding@resend.dev — CHỈ gửi được về email chủ tài khoản Resend cho tới khi verify domain thật, xem supabase/README.md)"
          else
            echo "SMTP: chưa có secret RESEND_API_KEY — dùng mailer mặc định của Supabase (giới hạn thấp)"
          fi
          curl -fsS -X PATCH "https://api.supabase.com/v1/projects/$REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" > /dev/null
          echo "auth config: jwt_exp=604800, mailer_autoconfirm=true, site_url=https://demo-synaptek.vercel.app"
