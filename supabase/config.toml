# Synaptek — Supabase config-as-code (mirror twolody).
# Local: `supabase start` · Hosted: `supabase db push` + `supabase functions deploy grade`.
project_id = "synaptek"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# Cổng mặc định của Expo web dev (expo start --web).
site_url = "http://localhost:8081"
# Wildcard (**) để khớp cả đường dẫn con — vd /reset-password (D47, quên mật khẩu).
additional_redirect_urls = ["http://localhost:8081/**", "synaptek://**"]
# Phiên đăng nhập 1 tuần (đỡ phải đăng nhập lại khi demo/dùng thường). Hosted: set tương ứng ở Dashboard.
jwt_expiry = 604800
enable_signup = true

[auth.email]
enable_signup = true
# MVP: tắt xác nhận email cho dev; bật lại ở production.
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "oneshot"

# Chấm chính thức server-side: bắt buộc đăng nhập (D4).
[functions.grade]
verify_jwt = true

# Job nền nhắc ôn (D21): gọi bởi cron, không có user JWT → tự kiểm secret trong code.
[functions.review-scheduler]
verify_jwt = false

# Chấm chính thức bài tập (M3 US2, D4): HS phải đăng nhập (xác thực JWT trong code + kiểm membership).
[functions.grade-assignment]
verify_jwt = true

# Gia sư AI (D46): giải thích vì sao sai — bắt buộc đăng nhập (chống gọi ẩn danh tốn phí API).
[functions.ai-tutor-explain]
verify_jwt = true
